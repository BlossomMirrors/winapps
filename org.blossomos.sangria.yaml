app-id: org.blossomos.sangria
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: sangria

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/sangria/cargo
  build-args:
    - --share=network

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

  - --talk-name=org.freedesktop.Flatpak

  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

  - --talk-name=org.freedesktop.Notifications

modules:
  - name: sangria
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/sangria /app/bin/sangria
      - install -Dm644 org.blossomos.sangria.desktop /app/share/applications/org.blossomos.sangria.desktop
      - install -Dm644 org.blossomos.sangria.metainfo.xml /app/share/metainfo/org.blossomos.sangria.metainfo.xml
      - install -Dm644 org.blossomos.sangria.svg /app/share/icons/hicolor/scalable/apps/org.blossomos.sangria.svg
    sources:
      - type: dir
        path: .
