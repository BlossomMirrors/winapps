[package]
name = "sangria"
version = "0.1.0"
authors = [ "Blossom Labs <hello@blossomos.org>", "Leonie Ain <me@koyu.space>" ]
edition = "2024"
license = "MIT"

[dependencies]
cxx = "1.0.192"
cxx-qt = "0.8.0"
cxx-qt-lib = { version = "0.8.0",  features = ["qt_full"] }
cxx-qt-lib-extras = "0.8"
libc = "0.2"
lnk = "0.6"
ureq = "3"
tar = "0.4"
xz2 = "0.1"
sha2 = "0.11"
pelite = "0.10"
ico = "0.5"
msi = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cxx-kde-frameworks = { git = "https://invent.kde.org/libraries/cxx-kde-frameworks.git" }

[build-dependencies]
# The link_qt_object_files feature is required for statically linking Qt 6.
cxx-qt-build = { version = "0.8", features = [ "link_qt_object_files" ] }
