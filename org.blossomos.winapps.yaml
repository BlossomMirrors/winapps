app-id: org.blossomos.winapps
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-25.08
command: run-exe

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --allow=devel
  - --allow=multiarch
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak

extensions:
  org.winehq.Wine.gecko:
    directory: share/wine/gecko
    version: stable-25.08
  org.winehq.Wine.mono:
    directory: share/wine/mono
    version: stable-25.08

modules:
  - name: winapps-metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 org.blossomos.winapps.metainfo.xml /app/share/metainfo/org.blossomos.winapps.metainfo.xml
      - install -Dm644 org.blossomos.winapps.svg /app/share/icons/hicolor/scalable/apps/org.blossomos.winapps.svg
      - install -Dm644 org.blossomos.winapps.desktop /app/share/applications/org.blossomos.winapps.desktop
      - install -Dm755 run-exe /app/bin/run-exe
    sources:
      - type: file
        path: org.blossomos.winapps.metainfo.xml
      - type: file
        path: org.blossomos.winapps.svg
      - type: file
        path: org.blossomos.winapps.desktop
      - type: file
        path: run-exe
