app-id: org.blossomos.winapps
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: winapps

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable//25.08

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/winapps/cargo
  build-args:
    - --share=network

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

  - --talk-name=org.freedesktop.Flatpak

  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media

  - --talk-name=org.freedesktop.Notifications

modules:
  - name: winapps
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/winapps /app/bin/winapps
      - install -Dm644 org.blossomos.winapps.desktop /app/share/applications/org.blossomos.winapps.desktop
      - install -Dm644 org.blossomos.winapps.metainfo.xml /app/share/metainfo/org.blossomos.winapps.metainfo.xml
      - install -Dm644 org.blossomos.winapps.svg /app/share/icons/hicolor/scalable/apps/org.blossomos.winapps.svg
    sources:
      - type: dir
        path: .
